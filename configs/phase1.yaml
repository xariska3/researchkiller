# Phase 1 configuration (see docs/phase1_spec.md; choices in docs/step6_proposal.md).
# Loading is strict: unknown, duplicate or missing keys and wrong types raise.
# Values marked "placeholder" are not fixed by the spec; calibrate them in the
# Step 6 pilot. API keys come from the environment or from .env (see .env.example).

corpus:
  # OpenAlex /works filter strings, one sweep per topic.
  # `has_abstract:true` and `to_publication_date:<build date>` are always added.
  filters:
    - "primary_topic.id:T10028,language:en,from_publication_date:2025-01-01"   # Topic Modeling (LLM applications)
    - "primary_topic.id:T10181,language:en,from_publication_date:2025-01-01"   # NLP Techniques
    - "primary_topic.id:T12031,language:en,from_publication_date:2025-01-01"   # Speech and dialogue systems
    - "primary_topic.id:T10286,language:en,from_publication_date:2025-01-01"   # Information Retrieval and Search Behavior
  language: en
  min_abstract_words: 50          # placeholder
  max_citers_per_target: 20       # placeholder
  max_works_per_sweep: 35000      # safety net; the largest sweep (T10028) had ~29k on 2026-10-12
  mailto_env: OPENALEX_MAILTO     # optional; OpenAlex has ignored mailto since Feb 2026
  api_key_env: OPENALEX_API_KEY   # optional, but a free key gives 10x the daily budget
  out_dir: data/corpus

bench:
  n_targets: 500                  # the pilot is the first 30 in seeded order (--limit 30)
  target_from_date: 2026-01-01    # must be later than every model's training_cutoff
  max_attempts_per_target: 4      # 3 exhausted 14 of 40 pilot targets
  max_distinctive_overlap: 0.15   # fraction of the abstract's top-20 IDF terms (0.15 = 3)
  max_content_jaccard: 0.15       # placeholder
  # A title stem is banned only if fewer than 2% of corpus documents contain it: names
  # and paper-defining terms (abduction 0.09%, faithfulness 1.3%) stay banned, common
  # task words (translation 9.5%, question 15.5%, graph 6.8%) are allowed. The pilot's
  # 215 title stems have median df 3.6%; 0.02 bans the rarest 36% of them.
  title_stem_max_df: 0.02
  seed: 42
  out_dir: data/bench

retrieval:
  encoder: Qwen/Qwen3-Embedding-0.6B
  encoder_revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3   # HF commit (main on 2026-10-12)
  encoder_dtype: float16          # same Hit@1 as float32 in the Step 6a check, ~4x faster
  encoder_max_seq_length: 512     # model default is 32k; abstracts are ~430 tokens at p90
  # Model card format for queries: "Instruct: <one-sentence task>\nQuery:<query>".
  # Documents get no prefix.
  query_prefix: "Instruct: Given a research proposal, retrieve scientific papers that describe the same research idea\nQuery:"
  max_queries: 5                          # placeholder; B4 and B5
  max_llm_calls_agent: 6                  # placeholder; B5
  max_queries_unconstrained: 15           # placeholder; B5-U
  max_llm_calls_agent_unconstrained: 20   # placeholder; B5-U
  index_dir: data/index

# Phase 2 live retrieval (docs/phase2_spec.md). The agent loop keeps the B5 caps
# above (max_queries, max_llm_calls_agent) and the encoder settings above.
live:
  cache_path: data/cache/openalex.sqlite   # every OpenAlex response
  results_per_query: 50           # keyword search, one page (OpenAlex max 100)
  semantic_search: true           # OpenAlex search.semantic, merged into the pool
  semantic_results_per_query: 50  # OpenAlex maximum
  keyword_max_words: 32           # longer queries (the user's text) get semantic search only
  max_pool_size: 500              # distinct candidates; 5 queries x 100 results never exceed it
  top_k: 20                       # kept after the local hybrid rerank
  explain_top_k: 10               # used by the overlap explainer (Step 3)
  cost_cap_per_check: 0.10        # USD, OpenAlex + LLM; the check fails rather than exceed it
  openalex_timeout_s: 30
  # OpenAlex work types kept: papers, plus literature reviews, books, reports and
  # software papers (a survey, tech report or software paper on the same idea is prior
  # art too). Datasets, errata, peer reviews, paratext, letters, editorials and other
  # non-papers are dropped (https://help.openalex.org/data/work-types/).
  work_types: [article, preprint, conference-paper, book-chapter, dissertation, review, book,
               report, software-paper]
  cache_ttl_days: 7               # live tool only; evaluation runs never expire
  # live-eval compares with this Phase 1 run (the full run: B5, and B1's difficulty buckets)
  phase1_run: "20261013-185712"
  mlflow_experiment: researchkiller-phase2-live

# Phase 2 Step 3: the automated head-to-head (python -m rk compete; prices and API facts
# checked 2026-10-14, docs/reports/phase2-step3-plan.md). A system's cost_cap is its
# cumulative spend over every compete run (table compete_spend in cache_path), and
# reserve_per_query is held back before each real call, so a call that could cross the
# cap is refused. Prices are USD per million tokens, per search and per request.
compete:
  runs: [runs/live-20261014-122144]   # the dev set; the test run is added when it finishes
  cache_path: data/cache/compete.sqlite
  n_queries: 100
  crossref_mailto_env: CROSSREF_MAILTO
  systems:
    - name: claude
      kind: anthropic
      model: claude-sonnet-5-5
      base_url: https://api.anthropic.com/v1
      api_key_env: ANTHROPIC_API_KEY
      web_search_tool: web_search_20260318   # dynamic filtering, the current default
      max_searches: 5
      max_tokens: 8192
      price_in_per_m: 2.0
      price_out_per_m: 10.0
      price_per_search: 0.01
      reserve_per_query: 1.0
      cost_cap: 40.0                # of the $100 promotional credit (expires 2026-10-18)
      requests_per_second: 0.5
      timeout_s: 600
    - name: openai
      kind: openrouter
      model: openai/gpt-6.1-sol
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      web_search_tool: "openrouter:web_search"   # engine native: OpenAI's own search
      max_searches: 5
      max_tokens: 16384             # reasoning tokens count here too
      price_in_per_m: 2.0
      price_out_per_m: 10.0
      price_per_search: 0.01
      reserve_per_query: 0.5
      cost_cap: 4.5                 # OpenRouter balance $6.69 on 2026-10-14, shared
      requests_per_second: 0.5
      timeout_s: 600
    - name: perplexity
      kind: openrouter
      model: perplexity/sonar
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      search_context_size: low      # Perplexity's default
      max_tokens: 4096
      price_in_per_m: 1.0
      price_out_per_m: 1.0
      price_per_request: 0.005
      reserve_per_query: 0.03
      cost_cap: 1.0
      requests_per_second: 0.5
      timeout_s: 300
    - name: s2-search
      kind: s2-search
      base_url: https://api.semanticscholar.org/graph/v1
      api_key_env: SEMANTIC_SCHOLAR_API_KEY   # optional
      requests_per_second: 1.0
      timeout_s: 60
    - name: s2-snippets
      kind: s2-snippets
      base_url: https://api.semanticscholar.org/graph/v1
      api_key_env: SEMANTIC_SCHOLAR_API_KEY   # optional
      requests_per_second: 1.0
      timeout_s: 60

run:
  out_dir: runs
  cache_path: data/cache/llm.sqlite   # LLM cache + cumulative spend table
  seed: 42
  budget_cap: 12.0                # USD; hard cap on real LLM spend across all commands
  results_db: data/results.sqlite # runs + query_results tables, read by `rk report`
  mlflow_tracking_uri: sqlite:///mlflow.db   # repo root; artifacts go to mlartifacts/ beside it
  mlflow_experiment: researchkiller-phase1

# Model roles. All three must come from different model families, and
# bench.target_from_date must be later than every training_cutoff (both checked
# at load time). Where no cutoff is published, the release date is used, since
# it bounds the cutoff from above. `provider` pins one OpenRouter endpoint with
# fallbacks disabled; prices are that endpoint's OpenRouter prices on 2026-10-12.
# Every pinned endpoint lists `seed` among its supported parameters.
paraphraser:
  name: meta-llama/llama-4-maverick
  family: llama
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  provider: novita/fp8            # cheapest endpoint that honours seed (DigitalOcean doesn't)
  price_in_per_m: 0.27
  price_out_per_m: 0.85
  temperature: 0.7
  max_tokens: 400
  seed: 42
  training_cutoff: 2024-08-31     # model card: "a cutoff of August 2024"

# The judge caught 90-100% of every corruption type in validate-judge; gpt-4.1-mini
# and gpt-4.1 caught 40% and 43% of the generalised ones (data/judge_validation_*).
judge:
  name: mistralai/mistral-medium-3.1
  family: mistral
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  provider: mistral               # first party; lists structured_outputs, so the schema is kept
  price_in_per_m: 0.40
  price_out_per_m: 2.00
  temperature: 0.0
  max_tokens: 800                 # the facet-by-facet JSON answer runs to ~300-500 tokens
  seed: 42
  # Release date (OpenRouter `created` 2025-08-13); Mistral publishes no cutoff.
  training_cutoff: 2025-08-13

agent:
  name: qwen/qwen3-235b-a22b-2507
  family: qwen
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  provider: parasail/fp8          # 100% uptime; the cheaper DeepInfra endpoint was degraded
  price_in_per_m: 0.14
  price_out_per_m: 0.80
  temperature: 0.0
  max_tokens: 400
  seed: 42
  training_cutoff: 2025-07-21     # release date (HF createdAt); no published cutoff
