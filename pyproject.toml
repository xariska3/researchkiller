[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "researchkiller"
dynamic = ["version"]
description = "Prior-art retrieval benchmark for terminology-shifted research proposals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "numpy",
    "pyyaml",
    "bm25s",
    "faiss-cpu",
]

[project.optional-dependencies]
dense = ["sentence-transformers"]
tracking = ["mlflow"]
dev = ["pytest", "ruff==0.17.0"]  # ruff pinned: its default rule set changes between releases

[project.scripts]
rk = "rk.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rk = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: talks to the live OpenAlex API; deselected unless run with -m network"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
