[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "researchkiller"
dynamic = ["version"]
description = "Prior-art retrieval benchmark for terminology-shifted research proposals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "numpy",
    "pyyaml",
    "bm25s",
    "faiss-cpu",
    "mlflow",
    "python-dotenv",
    "pydantic>=2",  # the check's report schema (docs/phase2_spec.md, Architecture)
    # The web app (docs/phase2_spec.md, Architecture): all installed with mlflow already.
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "jinja2",
]

[project.optional-dependencies]
# Lower bounds from the Qwen3-Embedding model card (transformers < 4.51 can't load qwen3).
dense = ["sentence-transformers>=2.7.0", "transformers>=4.51.0"]
dev = ["pytest", "ruff==0.17.0"]  # ruff pinned: its default rule set changes between releases

[project.scripts]
rk = "rk.cli:entry"

[tool.setuptools.dynamic]
version = { attr = "rk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rk = ["prompts/*.txt", "data/*.txt", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: talks to the live OpenAlex API; deselected unless run with -m network"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
